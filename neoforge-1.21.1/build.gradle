plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.0.182'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = "${project.mod_id}-neoforge-${project.minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// shared code is in ../common
sourceSets {
    main {
        java.srcDir '../common/src/main/java'
        resources.srcDir '../common/src/main/resources'
        runs {
            modIdentifier project.mod_id
        }
    }
}

configurations {
    // mods for the dev game, copied into run/mods
    devMods {
        canBeConsumed = false
        transitive = false
    }
}

runs {
    configureEach {
        modSource project.sourceSets.main
    }
    client {
        workingDirectory.set(project.file('run'))
    }
    server {
        workingDirectory.set(project.file('run-server'))
        programArgument '--nogui'
    }
}

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven { url = "https://maven.fzzyhmstrs.me/" }
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"

    compileOnly "maven.modrinth:simply-swords:${project.simply_swords_version}"
    compileOnly("me.fzzyhmstrs:fzzy_config:${project.fzzy_config_version}") {
        transitive = false
    }

    devMods "maven.modrinth:simply-swords:${project.simply_swords_version}"
    devMods "maven.modrinth:simply-tooltips:${project.simply_tooltips_version}"
    devMods "maven.modrinth:fzzy-config:${project.fzzy_config_version}"
    devMods "maven.modrinth:architectury-api:${project.architectury_version}"
    devMods "maven.modrinth:kotlin-for-forge:${project.kotlinforforge_version}"
    // shaders
    devMods "maven.modrinth:sodium:${project.sodium_version}"
    devMods "maven.modrinth:iris:${project.iris_version}"
}

tasks.register('prepareDevMods', Sync) {
    from configurations.devMods
    into layout.projectDirectory.dir('run/mods')
}
tasks.register('prepareServerMods', Sync) {
    from configurations.devMods
    exclude 'sodium-*', 'iris-*'
    into layout.projectDirectory.dir('run-server/mods')
}
tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn 'prepareDevMods'
}
tasks.matching { it.name == 'runServer' }.configureEach {
    dependsOn 'prepareServerMods'
}

tasks.withType(ProcessResources).configureEach {
    inputs.property "version", project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand "version": project.version
    }
    // NeoForge renamed the model extensions
    filesMatching('assets/simplyanime/models/item/*.json') {
        filter { it.replace('"forge_data"', '"neoforge_data"').replace('forge:separate_transforms', 'neoforge:separate_transforms') }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
